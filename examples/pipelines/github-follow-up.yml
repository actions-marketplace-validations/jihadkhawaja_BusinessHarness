# Copy into a trusted consumer workflow. Replace the pinned action reference.
# The runner must expose a trusted policy and persistent, isolated memory storage.
name: BusinessHarness follow-up
on:
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: businessharness-follow-up-${{ github.repository }}
  cancel-in-progress: false
jobs:
  review:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@businessharness')
    runs-on: [self-hosted, linux, harness-memory]
    environment: ai-review
    steps:
      - name: Resolve current request commits
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '"base=\(.base.sha)\nhead=\(.head.sha)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.request.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Review with remembered follow-ups
        uses: YOUR_ORG/BusinessHarness@FULL_COMMIT_SHA
        with:
          base: ${{ steps.request.outputs.base }}
          head: ${{ steps.request.outputs.head }}
          model: ${{ vars.HARNESS_MODEL }}
          config: ${{ vars.HARNESS_POLICY_PATH }} # Runner-managed; never from the PR branch.
          memory-directory: ${{ vars.HARNESS_MEMORY_DIRECTORY }}
          event: ${{ github.event_path }}
          feedback: comment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
