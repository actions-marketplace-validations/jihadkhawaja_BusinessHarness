<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BusinessHarness Glyph">
  <defs>
    <linearGradient id="glyphOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7f59"/>
      <stop offset="50%" stop-color="#e05a36"/>
      <stop offset="100%" stop-color="#ba3c1b"/>
    </linearGradient>
    <linearGradient id="glyphSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f6f5f1"/>
      <stop offset="100%" stop-color="#d4d1c5"/>
    </linearGradient>
  </defs>

  <!-- Base Glyph 'b' -->
  <path d="M 144 130 
           V 382 
           H 200 
           C 272 382, 272 230, 200 230 
           H 144"
        fill="none" 
        stroke="url(#glyphSilver)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Center Spine 'h' -->
  <path d="M 272 130 V 382" 
        fill="none" 
        stroke="url(#glyphSilver)" 
        stroke-width="38" 
        stroke-linecap="round"/>

  <!-- Dynamic Harness Arch in Terracotta -->
  <path d="M 272 230 
           C 272 160, 368 160, 368 230 
           V 382" 
        fill="none" 
        stroke="url(#glyphOrange)" 
        stroke-width="38" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Verification Beacon -->
  <circle cx="368" cy="382" r="8" fill="#8ce0a0"/>
</svg>
